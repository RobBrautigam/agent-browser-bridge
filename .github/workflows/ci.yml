# Every pull request: install from the lockfile, run the tests and the gate.
#
# Read-only on purpose. The job needs nothing but the code, so it gets no
# secrets, a token that can only read the repository, and a checkout that does
# not keep that token in the git config. The actions are pinned to full commit
# SHAs (the tag in the comment), because a tag can be moved and a SHA cannot.
#
# Windows is the reference platform (named pipes, the scheduled task); Ubuntu
# covers the Unix socket path the broker and host take everywhere else.

name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          # No dependency cache: two packages install in seconds, and a cache
          # is state a pull request could otherwise share with later runs.
          package-manager-cache: false

      - run: npm ci
      - run: npm test
      - run: npm run gate
